<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-label="Cloud migration: an old server moved into the cloud, now live">
  <defs>
  </defs>

  <!-- Old server rack -->
  <rect x="100" y="230" width="210" height="360" rx="18" fill="#2A3142" stroke="#3F4A60" stroke-width="2"/>
  <g>
    <rect x="122" y="256" width="166" height="46" rx="8" fill="#1A2030" stroke="#3F4A60" stroke-width="2"/><circle cx="142" cy="279" r="5" fill="#9AA3B5"/><rect x="162" y="272" width="100" height="4" rx="2" fill="#3F4A60"/><rect x="162" y="282" width="80" height="4" rx="2" fill="#3F4A60"/>
    <rect x="122" y="320" width="166" height="46" rx="8" fill="#1A2030" stroke="#3F4A60" stroke-width="2"/><circle cx="142" cy="343" r="5" fill="#F0A35E"/><rect x="162" y="336" width="100" height="4" rx="2" fill="#3F4A60"/><rect x="162" y="346" width="80" height="4" rx="2" fill="#3F4A60"/>
    <rect x="122" y="384" width="166" height="46" rx="8" fill="#1A2030" stroke="#3F4A60" stroke-width="2"/><circle cx="142" cy="407" r="5" fill="#9AA3B5"/><rect x="162" y="400" width="100" height="4" rx="2" fill="#3F4A60"/><rect x="162" y="410" width="80" height="4" rx="2" fill="#3F4A60"/>
    <rect x="122" y="448" width="166" height="46" rx="8" fill="#1A2030" stroke="#3F4A60" stroke-width="2"/><circle cx="142" cy="471" r="5" fill="#F0A35E"/><rect x="162" y="464" width="100" height="4" rx="2" fill="#3F4A60"/><rect x="162" y="474" width="80" height="4" rx="2" fill="#3F4A60"/>
    <rect x="122" y="512" width="166" height="46" rx="8" fill="#1A2030" stroke="#3F4A60" stroke-width="2"/><circle cx="142" cy="535" r="5" fill="#9AA3B5"/><rect x="162" y="528" width="100" height="4" rx="2" fill="#3F4A60"/><rect x="162" y="538" width="80" height="4" rx="2" fill="#3F4A60"/>
  </g>
  <text x="205" y="630" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#9AA3B5">Old server</text>

  <!-- Transfer path -->
  <path d="M318 410 C 400 410 420 330 500 330" stroke="#9DB8FF" stroke-width="4" stroke-dasharray="10 10" fill="none" stroke-linecap="round"/>
  <path d="M490 318 l16 12 l-16 12" stroke="#9DB8FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="362" y="392" width="18" height="18" rx="4" fill="#3E6FE0"/>
  <rect x="428" y="352" width="18" height="18" rx="4" fill="#9DB8FF"/>

  <!-- Cloud glow -->
  <g fill="#3E6FE0" opacity="0.18">
    <circle cx="640" cy="330" r="100"/><circle cx="740" cy="262" r="126"/><circle cx="840" cy="330" r="96"/><rect x="640" y="300" width="200" height="130"/>
  </g>
  <!-- Cloud -->
  <g fill="#2A3142">
    <circle cx="640" cy="330" r="86"/><circle cx="740" cy="262" r="110"/><circle cx="840" cy="330" r="82"/><rect x="640" y="300" width="200" height="116"/>
  </g>
  <rect x="705" y="168" width="70" height="28" rx="14" fill="#3E6FE0"/>
  <text x="740" y="188" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">AWS</text>

  <!-- Services inside cloud -->
  <rect x="600" y="296" width="88" height="88" rx="16" fill="#1F2533" stroke="#3F4A60" stroke-width="2"/>
  <rect x="626" y="322" width="36" height="36" rx="6" fill="none" stroke="#9DB8FF" stroke-width="3"/>
  <rect x="636" y="332" width="16" height="16" rx="2" fill="#9DB8FF"/>
  <path d="M634 316 v6 M644 316 v6 M654 316 v6 M634 358 v6 M644 358 v6 M654 358 v6 M620 330 h6 M620 340 h6 M620 350 h6 M662 330 h6 M662 340 h6 M662 350 h6" stroke="#9DB8FF" stroke-width="2" stroke-linecap="round"/>

  <rect x="696" y="296" width="88" height="88" rx="16" fill="#1F2533" stroke="#3F4A60" stroke-width="2"/>
  <ellipse cx="740" cy="324" rx="18" ry="7" fill="none" stroke="#9DB8FF" stroke-width="3"/>
  <path d="M722 324 v28 a18 7 0 0 0 36 0 v-28 M722 338 a18 7 0 0 0 36 0" fill="none" stroke="#9DB8FF" stroke-width="3"/>

  <rect x="792" y="296" width="88" height="88" rx="16" fill="#1F2533" stroke="#3F4A60" stroke-width="2"/>
  <path d="M815 326 h14 l6 7 h22 v24 h-42 z" fill="none" stroke="#9DB8FF" stroke-width="3" stroke-linejoin="round"/>

  <!-- Status card -->
  <rect x="520" y="480" width="380" height="220" rx="18" fill="#F7F8FA"/>
  <text x="548" y="522" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1E26">Migration</text>
  <rect x="740" y="500" width="136" height="34" rx="17" fill="#DDF4EA"/>
  <path d="M758 517 l5 5 l9 -10" stroke="#1F6E4E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="780" y="523" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F6E4E">Complete</text>

  <text x="548" y="572" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#545B69">Uptime</text>
  <rect x="640" y="560" width="236" height="16" rx="8" fill="#E3E7EE"/><rect x="640" y="560" width="226" height="16" rx="8" fill="#3E6FE0"/>
  <text x="548" y="612" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#545B69">Speed</text>
  <rect x="640" y="600" width="236" height="16" rx="8" fill="#E3E7EE"/><rect x="640" y="600" width="196" height="16" rx="8" fill="#9DB8FF"/>
  <text x="548" y="652" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#545B69">Cost</text>
  <rect x="640" y="640" width="236" height="16" rx="8" fill="#E3E7EE"/><rect x="640" y="640" width="110" height="16" rx="8" fill="#3FB98A"/>
</svg>
