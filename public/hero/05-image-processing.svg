      </g>
      <circle cx="347" cy="224" r="50" fill="url(#hot)"/>
      <circle cx="415" cy="332" r="42" fill="url(#hot)"/>
      <path d="M190 372 l14 10 l-6 8 l16 14" stroke="#E6E9EF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

