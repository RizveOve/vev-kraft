  <text x="662" y="496" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#1A1E26">Cracks</text>
  <text x="876" y="496" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1E26">1</text>
  <circle cx="644" cy="528" r="7" fill="#3FB98A"/>
  <text x="662" y="534" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#1A1E26">Panels OK</text>
  <text x="876" y="534" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1E26">17</text>

  <line x1="634" y1="560" x2="876" y2="560" stroke="#E3E7EE" stroke-width="2"/>
