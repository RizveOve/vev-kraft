    <rect x="360" y="584" width="88" height="64" rx="4" fill="#4A5160"/><rect x="368" y="592" width="22" height="20" fill="#1E3566"/><rect x="394" y="592" width="22" height="20" fill="#1E3566"/><rect x="420" y="592" width="22" height="20" fill="#1E3566"/><rect x="368" y="618" width="22" height="20" fill="#1E3566"/><rect x="394" y="618" width="22" height="20" fill="#1E3566"/><rect x="420" y="618" width="22" height="20" fill="#1E3566"/>
