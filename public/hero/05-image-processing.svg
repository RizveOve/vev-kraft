      <rect x="378" y="302" width="74" height="60" rx="4" fill="none" stroke="#F0A35E" stroke-width="3"/>
      <rect x="378" y="276" width="78" height="22" rx="4" fill="#F0A35E"/>
      <text x="386" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1E26">Hotspot</text>

