  <circle cx="644" cy="452" r="7" fill="#F07C3E"/>
  <text x="662" y="458" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#1A1E26">Hotspots</text>
  <text x="876" y="458" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1E26">2</text>
